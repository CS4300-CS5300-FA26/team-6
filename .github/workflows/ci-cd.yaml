name: CI/CD

on:
  pull_request:
    branches: [main]

  push:

  # Adds a "Run workflow" button in GitHub
  workflow_dispatch:

jobs:
  lint_and_test:
    name: Lint and Test
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "fake-secret-key"

    # If I can get the container image used for DevEdu I won't need to setup python.
    # container:
    #   image: abc.io/container/path-to-container-image

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run linter
        run: pylint --fail-under=8.0 .

      - name: Check test
        run: python -m pytest

      - name: Code Coverage
        run: |
          coverage run --source=canvas_plus,src -m pytest
          coverage report -m --fail-under=80

  # Sends each pull request's changes to OpenAI and posts the review as a PR comment.
  # Separate from lint_and_test, so an OpenAI problem never blocks the tests.
  ai_review:
    name: AI Code Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      # Uses the repo variable if one exists (Settings > Secrets and variables >
      # Actions > Variables), or else the default after ||. Lets us test failure cases
      # without changing code.
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6-luna' }}
      MAX_DIFF_CHARS: ${{ vars.MAX_DIFF_CHARS || '30000' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history, so the PR can be compared against main

      - name: Collect the pull request diff
        run: |
          # Only what this PR changed since it branched off main
          git diff "origin/${{ github.base_ref }}...HEAD" > diff.txt
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > files.txt

          # Very large diffs cost more and can exceed OpenAI's input limit, so trim them.
          # TRUNCATED goes into $GITHUB_ENV so later steps can see it.
          if [ "$(wc -c < diff.txt)" -gt "$MAX_DIFF_CHARS" ]; then
            head -c "$MAX_DIFF_CHARS" diff.txt > diff_trimmed.txt
            mv diff_trimmed.txt diff.txt
            echo "TRUNCATED=true" >> "$GITHUB_ENV"
          fi

      - name: Ask OpenAI for a review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Guidelines file -> instructions, diff -> input. jq builds the JSON safely,
          # so quotes or symbols in the diff cannot break the request.
          jq -n --arg model "$OPENAI_MODEL" \
            --rawfile instructions .github/ai-review-guidelines.md \
            --rawfile diff diff.txt \
            '{model: $model, instructions: $instructions, input: $diff}' > request.json

          # Send it. Saves the reply to response.json and the status code (200 = OK).
          HTTP_STATUS=$(curl -sS -o response.json -w "%{http_code}" \
            https://api.openai.com/v1/responses \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            --data @request.json) || HTTP_STATUS="000"

          # Pull the review text out of OpenAI's reply (stays empty if anything failed)
          REVIEW=""
          if [ "$HTTP_STATUS" = "200" ]; then
            REVIEW=$(jq -r '[.output[]? | select(.type == "message") | .content[]? | select(.type == "output_text") | .text] | join("\n")' response.json) || REVIEW=""
          fi

          # Changed files as one line: `a.py`, `b.py`
          FILES=$(sed 's/.*/`&`/' files.txt | paste -sd ',' - | sed 's/,/, /g')

          # Build the comment. If OpenAI failed, say so instead of crashing.
          {
            echo "## 🤖 AI Code Review"
            echo "**Files changed:** $FILES"
            echo
            if [ -n "$REVIEW" ]; then
              echo "$REVIEW"
            else
              echo "⚠️ AI review could not be completed (OpenAI error, HTTP $HTTP_STATUS)."
            fi
            echo
            if [ "${TRUNCATED:-false}" = "true" ]; then
              echo "_Note: diff was over the size limit; only part of it was reviewed._"
            fi
            echo "_AI-generated review. A teammate still has to approve._"
          } > review.md

      - name: Post the review as a PR comment
        env:
          GH_TOKEN: ${{ github.token }}  # temporary token GitHub creates for this run
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file review.md

  deploy:
    name: Deploy
    needs: lint_and_test
    if: >-
      github.event.local_test != true &&
      github.event_name == 'push' && 
      github.ref == 'refs/heads/main'
    concurrency:
      group: production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "."

      - name: Build container
        run: echo "Build container"

      - name: Deploy
        run: echo "Replace with your deployment command"

      - name: Post Deployment Health Check
        run: echo "Check that deployment is successful"
