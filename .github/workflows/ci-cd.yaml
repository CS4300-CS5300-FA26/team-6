name: CI/CD

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

  # Adds a "Run workflow" button in GitHub
  workflow_dispatch:

jobs:
  lint_and_test:
    name: Lint and Test
    runs-on: ubuntu-latest

    # If I can get the container image used for DevEdu I won't need to setup python.
    # container:
    #   image: abc.io/container/path-to-container-image

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ".[dev]"

      - name: Run linter
        run: pylint --fail-under=8.0 .

      - name: Check test
        run: python -m pytest

      - name: Code Coverage
        run: |
          coverage run --source=src -m pytest
          coverage report -m --fail-under=80

  deploy:
    name: Deploy
    needs: lint_and_test
    if: >-
      github.event.local_test != true &&
      github.event_name == 'push' && 
      github.ref == 'refs/heads/main'
    concurrency:
      group: production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "."

      - name: Build container
        run: echo "Build container"

      - name: Deploy
        run: echo "Replace with your deployment command"

      - name: Post Deployment Health Check
        run: echo "Check that deployment is successful"
