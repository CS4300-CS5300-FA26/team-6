{% extends "base.html" %}

{% block title %}Course file{% endblock %}

{% block content %}
  <p><a href="{% url 'course_detail' course_id %}">← Back to course</a></p>
  {% if reason == "not_found" %}
    <h1>File not found</h1>
  {% else %}
    <p role="status">This file couldn't be loaded. Please try again.</p>
  {% endif %}
{% endblock %}
