{% block title %}Sign in{% endblock %}

{% block content %}
  <h1>Sign in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign in</button>
  </form>
  <p>New here? <a href="{% url 'register' %}">Create an account</a>.</p>
{% endblock %}
