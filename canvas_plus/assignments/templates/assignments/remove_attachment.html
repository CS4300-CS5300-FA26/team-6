{% extends "base.html" %}

{% block title %}Remove attachment{% endblock %}

{% block content %}
  <h1>Remove attachment</h1>
  <p>Remove {{ attachment.study_file.original_name }} from this assignment?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Remove</button>
  </form>
  <a href="{% url 'assignment_list' %}">Cancel</a>
{% endblock %}
