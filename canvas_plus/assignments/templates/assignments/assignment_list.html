<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>All Assignments</title>
</head>
<body>
  <h1>All Assignments</h1>
  <ul>
    {% for a in assignments %}
      <li>{{ a.title }} ({{ a.course }}), due {{ a.due_date|date:"M j, Y g:i A" }}</li>
    {% empty %}
      <li>You have no assignments.</li>
    {% endfor %}
  </ul>
</body>
</html>
