<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- viewport with width=device-width ensures the application scales properly on mobile device -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Canvas+{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body { display: flex; min-height: 100vh; margin: 0; font-family: sans-serif; overflow-wrap: anywhere; }
        nav { display: flex; flex: 0 0 12rem; flex-direction: column; min-height: 100vh; padding: 1rem; background: #17324d; color: white; }
        nav a { display: block; padding: 0.5rem; border-radius: 0.25rem; color: inherit; text-decoration: none; }
        nav a:hover, nav a:focus-visible { background: #284b6d; text-decoration: underline; }
        .nav-links { flex: 1; }
        .nav-links form { margin: 0; }
        .nav-links .logout-item { margin-top: auto; }
        .nav-links button { width: 100%; padding: 0.5rem; border: 0; border-radius: 0.25rem; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
        .nav-links button:hover, .nav-links button:focus-visible { background: #284b6d; text-decoration: underline; }
        .nav-links { display: flex; flex-direction: column; gap: 0.5rem; margin: 0; padding: 0; list-style: none; }
        .menu-toggle { display: none; font: inherit; padding: 0.5rem 1rem; }
        main { flex: 1; min-width: 0; max-width: 72rem; margin: 0 auto; padding: 1rem; }

        @media (max-width: 40rem) {
            nav { flex-basis: 8rem; padding: 0.5rem; }
            .menu-toggle { display: inline-block; padding: 0.5rem; }
            .nav-links { margin-top: 1rem; }
            .nav-links[hidden] { display: none; }
        }
    </style>
</head>
<body>
    <nav aria-label="Main navigation">
        <button class="menu-toggle" type="button" aria-expanded="true" aria-controls="navigation-links">
            Menu
        </button>
        <ul class="nav-links" id="navigation-links">
            <li><a href="{% url 'assignment_list' %}">Assignments</a></li>
            {% if user.is_authenticated %}
                <li class="logout-item">
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit">Log out</button>
                    </form>
                </li>
            {% endif %}
        </ul>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script>
        const menuToggle = document.querySelector('.menu-toggle');
        const navigationLinks = document.getElementById('navigation-links');
        const phoneScreen = window.matchMedia('(max-width: 40rem)');

        function setMenuExpanded(expanded) {
            menuToggle.setAttribute('aria-expanded', String(expanded));
            navigationLinks.hidden = !expanded;
        }

        setMenuExpanded(!phoneScreen.matches);
        phoneScreen.addEventListener('change', () => setMenuExpanded(!phoneScreen.matches));
        menuToggle.addEventListener('click', () => setMenuExpanded(navigationLinks.hidden));
    </script>
</body>
</html>
