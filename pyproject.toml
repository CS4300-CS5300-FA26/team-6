[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "canvas_plus"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "Django==6.1.1",
    "gunicorn>=26.2.0",
]

[tool.setuptools]
packages = []

[project.optional-dependencies]
dev = [
    "pylint==4.1.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]
