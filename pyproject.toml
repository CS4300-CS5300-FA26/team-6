[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "my-project"
version = "0.1.0"
dependencies = [
    "Django==6.1.1",
]

[tool.setuptools]
packages = []

[project.optional-dependencies]
dev = [
    "pylint==4.1.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-django==4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "canvas_plus.settings"
pythonpath = ["canvas_plus", "."]
python_files = ["test_*.py", "tests.py"]
markers = [
    "unit: fast tests of one piece in isolation, such as a single model method",
    "integration: tests that run several layers together, such as a request through URL, view, model, and template",
]

[tool.coverage.run]
omit = ["*/manage.py", "*/asgi.py", "*/wsgi.py", "*/migrations/*"]
